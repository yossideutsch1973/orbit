name: cartpole
env: CartPole-v1
state_dim: 4
action_dim: 2
seed: 42

dkn:
  n_layers: 2
  neurons_per_layer: 2
  d_lift: 8
  d_out_per_neuron: 4
  head_hidden: 0  # 0 = linear head directly

mlp_baseline:
  hidden: 64

training:
  algorithm: ppo_batched
  total_steps: 200000
  steps_per_update: 2048
  lr: 3.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  ppo_epochs: 4
  minibatch_size: 64
  max_grad_norm: 0.5
  entropy_coef: 0.01
  value_coef: 0.5

logging:
  log_interval: 10  # episodes
  spectra_interval: 50  # episodes, eigenvalue snapshots
  save_model: true
